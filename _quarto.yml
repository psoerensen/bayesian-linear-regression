project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - notes/notes.qmd
    - slides/bayesian_linear_regression_slides.qmd
    - slides/narrated_bayesian_linear_regression_slides.qmd
    - slides/advanced_bayesian_linear_regression_slides.qmd
    - slides/bayesian_magma_slides.qmd
    - slides/introduction_gact_qgg_slides.qmd
    - tutorials/classical_linear_regression_simulation.qmd
    - tutorials/bayesian_linear_regression_conjugate.qmd
    - tutorials/bayesian_spike_and_slab.qmd
    - tutorials/bayesian_magma_tutorial.qmd
  resources:
    - narration/**

website:
  title: "Bayesian Linear Regression"
  description: "Notes and Quarto demonstrations comparing classical, conjugate Bayesian, and spike-and-slab regression models."
  navbar:
    left:
      - text: "Home"
        href: index.html
      - text: "Notes"
        href: notes/notes.html
      - text: "BLR slides"
        href: slides/bayesian_linear_regression_slides.html
      - text: "BLR_GSEA slides"
        href: slides/advanced_bayesian_linear_regression_slides.html
      - text: "Bayesian MAGMA slides"
        href: slides/bayesian_magma_slides.html
      - text: "Classical Regression tutorial"
        href: tutorials/classical_linear_regression_simulation.html
      - text: "Bayesian (Gaussian Prior) tutorial"
        href: tutorials/bayesian_linear_regression_conjugate.html
      - text: "Bayesian (Spike & Slab) tutorial"
        href: tutorials/bayesian_spike_and_slab.html
      - text: "Bayesian MAGMA tutorial"
        href: tutorials/bayesian_magma_tutorial.html

format:
  html:
    embed-resources: true
    theme: flatly
    toc: false
    code-fold: true
    highlight-style: github

author:
  - name: "Palle Duun Rohde"
    affiliation:
      - "Genomic Medicine, Department of Health Science and Technology, Aalborg University, Denmark"
  - name: "Peter Sørensen"
    affiliation:
      - "Center for Quantitative Genetics and Genomics, Aarhus University, Denmark"
