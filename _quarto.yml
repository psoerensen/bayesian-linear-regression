project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - notes.qmd
    - bayesian_linear_regression_slides.qmd
    - narrated_bayesian_linear_regression_slides.qmd
    - advanced_bayesian_linear_regression_slides.qmd
    - bayesian_magma_slides.qmd
    - introduction_gact_qgg_slides.qmd
    - classical_linear_regression_simulation.qmd
    - bayesian_linear_regression_conjugate.qmd
    - bayesian_spike_and_slab.qmd
    - bayesian_magma_tutorial.qmd
  resources:
    - narration/**

website:
  title: "Bayesian Linear Regression"
  description: "Notes and Quarto demonstrations comparing classical, conjugate Bayesian, and spike-and-slab regression models."
  navbar:
    left:
      - text: "Home"
        href: index.html
      - text: "Notes"
        href: notes.html
      - text: "BLR slides"
        href: bayesian_linear_regression_slides.html
      - text: "BLR_GSEA slides"
        href: advanced_bayesian_linear_regression_slides.html
      - text: "Bayesian MAGMA slides"
        href: bayesian_magma_slides.html
      - text: "Classical Regression tutorial"
        href: classical_linear_regression_simulation.html
      - text: "Bayesian (Gaussian Prior) tutorial"
        href: bayesian_linear_regression_conjugate.html
      - text: "Bayesian (Spike & Slab) tutorial"
        href: bayesian_spike_and_slab.html
      - text: "Bayesian MAGMA tutorial"
        href: bayesian_magma_tutorial.html

format:
  html:
    embed-resources: true
    theme: flatly
    toc: false
    code-fold: true
    highlight-style: github

author:
  - name: "Palle Duun Rohde"
    affiliation:
      - "Genomic Medicine, Department of Health Science and Technology, Aalborg University, Denmark"
  - name: "Peter Sørensen"
    affiliation:
      - "Center for Quantitative Genetics and Genomics, Aarhus University, Denmark"
